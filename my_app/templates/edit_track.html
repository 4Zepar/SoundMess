{% extends 'base.html' %}

{% block content %}
<section class="form-page">
    <p class="eyebrow">Artist workspace</p>
    <h1>Редактирование: {{ track.title }}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить изменения</button>
    </form>
</section>
{% endblock %}
