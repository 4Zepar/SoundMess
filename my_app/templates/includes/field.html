{% if field.is_hidden %}
{{ field }}
{% else %}

<div class="form-field {% if field.field.widget.input_type == 'checkbox' %}checkbox-field{% endif %}">

    {% if field.field.widget.input_type == 'checkbox' %}
    {{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}
        {% if field.field.required %}
        <span class="muted" aria-hidden="true">*</span>
        {% endif %}
    </label>{{ field }}
    {% endif %}

    {% if field.help_text %}
    <div class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>

    {% endif %}

    {% for error in field.errors %}
    <p class="errorlist" role="alert">{{ error }}</p>
    {% endfor %}

</div>
{% endif %}
