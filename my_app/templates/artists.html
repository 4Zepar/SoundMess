{% extends 'base.html' %}

{% block content %}
<section class="directory-page">
    <h1>Артисты</h1>
    <div class="artist-grid">
        {% for artist in artists %}
            <a class="artist-card" href="{% url 'artist_detail' artist.id %}">
                <div class="artist-avatar">{{ artist.user.username|first|upper }}</div>
                <strong>{{ artist.user.username }}</strong>
                <span>{{ artist.tracks.count }} треков</span>
            </a>
        {% empty %}
            <p class="muted">Одобренных артистов пока нет.</p>
        {% endfor %}
    </div>
</section>
{% endblock %}
