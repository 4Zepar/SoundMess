{% extends 'base.html' %}
{% block content %}
<section class="form-card upload-page">
    <p class="eyebrow">Artist workspace</p>
    <h1>Загрузка нового трека</h1>
    <p class="muted">Добавьте аудио, обложку и метаданные релиза.</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Опубликовать трек</button>
    </form>
    <a href="{% url 'profile' %}" class="muted">Назад в профиль</a>
</section>
{% endblock %}
